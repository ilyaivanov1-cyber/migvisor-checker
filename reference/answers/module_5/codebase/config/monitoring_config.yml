# CFG-011: Monitoring and alerting configuration for the Purchase ETL Workflow.
# Referenced by workflow_nightly_etl_main.yml for alert routing.
# No credential values in this file — webhook URLs use placeholder strings.

alert_sla_minutes: 15

email_notifications:
  on_failure:
    - data-engineering@company.com
    - data-platform-oncall@company.com
  on_start: []
  on_success: []

webhook_notifications:
  on_failure:
    - id: "{{SLACK_WEBHOOK_ID_PLACEHOLDER}}"
  on_start: []
  on_success: []

alert_trigger:
  condition: any_task_failure
  severity_levels:
    - ERROR
    - CRITICAL

suppression_windows:
  # Format: ISO 8601 intervals for planned maintenance (UTC)
  # Example: - start: "2026-09-01T02:00:00Z"
  #            end:   "2026-09-01T04:00:00Z"
  #            reason: "Monthly maintenance window"
  []
