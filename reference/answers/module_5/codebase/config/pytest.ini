[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Tests that run without a live Databricks cluster or external Spark session
    integration: Tests that require a Databricks cluster or a local Spark session connected to the test catalog

addopts = --strict-markers -v --tb=short

filterwarnings =
    ignore::DeprecationWarning:pyspark
    ignore::UserWarning:pyspark

log_cli = true
log_level = INFO
log_format = %(asctime)s UTC | %(levelname)s | %(message)s
log_date_format = %Y-%m-%dT%H:%M:%SZ
