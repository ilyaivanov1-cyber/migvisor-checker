# Stability guard: target file did not exist -- generated fresh.
# Basis: project/current/modernization-plan.md (source Microsoft SQL Server 2014
#   `wideworldimportersdw` -> target Databricks Delta Lake, Unity Catalog `purchasing`)
#   and the one available enrichment source, the Purchases product's as-is analysis
#   (authored under GlobalSales_Project prior to this project split; re-parented here
#   per modernization-plan.md §9).
# Scope note: Purchasing_Project targets the identical source/target platform pair as
#   GlobalSales_Project (same `wideworldimportersdw` SQL Server 2014 source, same
#   Databricks Delta Lake target family), differing only in the destination Unity
#   Catalog name (`purchasing` vs `globalsales`). Because type mapping is a
#   universal, engine-level contract that does not vary with catalog name, this rule
#   set closely resembles GlobalSales_Project's TY-types.yaml by design -- that
#   resemblance is expected and correct, not an authoring shortcut. Each rule below
#   was authored fresh against this project's own inputs; where the Purchases as-is
#   analysis directly evidences a source type (e.g. INT, BIGINT, DECIMAL, BIT, DATE,
#   DATETIME2, NVARCHAR, VARBINARY, IDENTITY, SEQUENCE) the rule's test cases use that
#   real column/table evidence. Where a SQL Server type is part of the general
#   platform-pair contract but has no evidenced occurrence in Purchases (TINYINT,
#   SMALLINT, MONEY, SMALLMONEY, FLOAT, REAL, CHAR/NCHAR, TIME, plain DATETIME,
#   SMALLDATETIME, DATETIMEOFFSET, IMAGE, UNIQUEIDENTIFIER, XML, SQL_VARIANT,
#   non-default COLLATE), the rule is retained as a baseline platform-level mapping
#   (this project may catalog further Purchasing-domain objects against the same
#   source database later) and is explicitly labelled "no current evidence in
#   Purchases as-is" in its test case notes rather than fabricating false evidence.
# Genuine, scope-grounded difference from GlobalSales_Project's TY-types.yaml:
#   GlobalSales_Project's rule TY-028 ("Classify and map application.* configuration
#   objects of unknown DDL type") is DELIBERATELY OMITTED here. Purchasing_Project's
#   modernization-plan.md §6 in-scope object inventory contains only `dimension`,
#   `fact`, `integration`, and `sequences` schema objects, and §7 Out-of-Scope Items
#   explicitly excludes "`application.*` config procedures not consumed by Purchases"
#   as remaining owned by GlobalSales_Project. No application.* object of any DDL
#   type -- known or unknown -- is in scope for this project, so that rule has no
#   basis here. This is a real scope difference, not an invented one.
dimension: Types
prefix: TY
project: "Purchasing_Project"
source_platform: "Microsoft SQL Server 2014"
target_platform: "Databricks (Delta Lake)"
generated: "2026-09-21"

rules:

  # ──────────────────────────────────────────────
  # INTEGER TYPES
  # ──────────────────────────────────────────────

  - id: TY-001
    dimension: Types
    name: Map TINYINT to BYTE
    intent: >
      Convert SQL Server TINYINT (0–255, 1 byte) to Spark SQL BYTE (TINYINT synonym),
      preserving the smallest integer footprint and avoiding unnecessary upcasting.
      No TINYINT column is evidenced in the Purchases as-is analysis; retained as a
      baseline platform-level mapping in case future Purchasing_Project objects on
      the same `wideworldimportersdw` source introduce one.
    activation:
      preconditions:
        - Column or variable declared as TINYINT in source DDL.
      scope: project
    transformation:
      source: "TINYINT"
      target: "BYTE"
      algorithm:
        - "Replace every occurrence of TINYINT in CREATE TABLE, ALTER TABLE, variable declarations, and CAST/CONVERT expressions with BYTE (Spark SQL alias for TINYINT)."
        - "Validate that all stored values fall within 0–127 (signed Spark BYTE range); if any value exceeds 127, upcast to SMALLINT and log a warning."
    validation:
      success_criteria:
        - All TINYINT columns render as BYTE in the generated Delta table DDL.
        - Row counts match between source and target after load.
        - No overflow errors during data transfer.
      quality_dimensions:
        - conformity
        - validity
      test_cases:
        - input: "TINYINT value = 0"
          expected: "BYTE value = 0"
          notes: "No current evidence in Purchases as-is; baseline boundary case."
        - input: "TINYINT value = 255"
          expected: "SMALLINT value = 255 with migration warning logged"
          notes: "Upcast path if a future Purchasing object exceeds signed BYTE range."
        - input: "CAST(status AS TINYINT)"
          expected: "CAST(status AS BYTE)"
    inheritance:
      level: project
      override: "A product may override the upcast threshold if a Purchasing_Project object profiles TINYINT values outside 0–127."
      extend: "A product may extend with column-specific overflow handling."
      deactivate: "May be deactivated if no TINYINT column is ever introduced into Purchasing_Project scope."

  - id: TY-002
    dimension: Types
    name: Map SMALLINT to SMALLINT
    intent: >
      Preserve SMALLINT (–32768 to 32767, 2 bytes) as the identical Spark SQL type.
      No semantic change required. No SMALLINT column is evidenced in the Purchases
      as-is analysis; retained as a baseline platform-level mapping.
    activation:
      preconditions:
        - Column or variable declared as SMALLINT in source DDL.
      scope: project
    transformation:
      source: "SMALLINT"
      target: "SMALLINT"
      algorithm:
        - "Retain SMALLINT keyword verbatim in all generated Spark SQL / Delta DDL."
        - "Confirm spelling is normalised to 'SMALLINT' for consistency."
    validation:
      success_criteria:
        - All SMALLINT columns appear as SMALLINT in Delta table DDL.
        - Data loads without type mismatch errors.
      quality_dimensions:
        - conformity
        - validity
      test_cases:
        - input: "reorder_level SMALLINT NOT NULL"
          expected: "reorder_level SMALLINT NOT NULL"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: "No override expected; direct type equivalence."
      extend: "None anticipated."
      deactivate: "May be deactivated if SMALLINT never appears in Purchasing_Project scope."

  - id: TY-003
    dimension: Types
    name: Map INT to INT
    intent: >
      Preserve SQL Server INT (–2^31 to 2^31–1, 4 bytes) as Spark SQL INT. This is
      the dominant integer type across Purchases: business-key columns
      (`WWI Purchase Order ID`, `WWI Supplier ID`, `WWI Stock Item ID`,
      `PackageTypeID`, `DeliveryMethodID`, `ContactPersonID`), the fact/dimension
      surrogate keys `Supplier Key`, `Stock Item Key`, `Lineage Key`, `Date Key`
      (on `Dimension.Date`), and calendar attributes `Calendar Year`, `Fiscal Year`,
      `ISO Week Number` are all declared INT per the Purchases as-is ER diagram.
    activation:
      preconditions:
        - Column or variable declared as INT or INTEGER in source DDL.
      scope: project
    transformation:
      source: "INT / INTEGER"
      target: "INT"
      algorithm:
        - "Normalise both INT and INTEGER keywords to INT in generated Spark SQL DDL."
        - "Retain NOT NULL / NULL constraints (see TY-021)."
        - "IDENTITY columns using INT are handed off to TY-023; SEQUENCE-generated INT surrogate keys are handed off to TY-024."
    validation:
      success_criteria:
        - All INT/INTEGER columns appear as INT in generated Delta DDL.
        - No implicit type widening introduced.
      quality_dimensions:
        - conformity
        - validity
      test_cases:
        - input: "wwi_purchase_order_id INT NOT NULL"
          expected: "wwi_purchase_order_id INT NOT NULL"
          notes: "Evidenced: Fact.Purchase / Purchase_Staging WWI Purchase Order ID."
        - input: "supplier_key INT NOT NULL"
          expected: "supplier_key INT NOT NULL"
          notes: "Evidenced: Dimension.Supplier surrogate key, per as-is 3.1/3.2."
        - input: "calendar_year INT"
          expected: "calendar_year INT"
          notes: "Evidenced: Dimension.Date.CalendarYear."
    inheritance:
      level: project
      override: false
      extend: "A product may extend with column-specific range validation."
      deactivate: false

  - id: TY-004
    dimension: Types
    name: Map BIGINT to BIGINT
    intent: >
      Preserve SQL Server BIGINT (–2^63 to 2^63–1, 8 bytes) as Spark SQL BIGINT.
      Evidenced on the two fact/staging surrogate keys of Purchases:
      `Fact.Purchase.Purchase Key` (IDENTITY, composite with `Date Key`) and
      `Integration.Purchase_Staging.Purchase Staging Key`.
    activation:
      preconditions:
        - Column or variable declared as BIGINT in source DDL.
      scope: project
    transformation:
      source: "BIGINT"
      target: "BIGINT"
      algorithm:
        - "Retain BIGINT keyword verbatim in all generated Spark SQL / Delta DDL."
        - "Confirm that IDENTITY BIGINT columns are handed off to TY-023."
    validation:
      success_criteria:
        - All BIGINT columns appear as BIGINT in generated Delta DDL.
        - Row counts and key values match source after full load.
      quality_dimensions:
        - conformity
        - validity
      test_cases:
        - input: "purchase_key BIGINT NOT NULL"
          expected: "purchase_key BIGINT NOT NULL"
          notes: "Evidenced: Fact.Purchase Purchase Key, IDENTITY per as-is 3.2."
        - input: "purchase_staging_key BIGINT NOT NULL"
          expected: "purchase_staging_key BIGINT NOT NULL"
          notes: "Evidenced: Integration.Purchase_Staging PK."
    inheritance:
      level: project
      override: false
      extend: false
      deactivate: false

  # ──────────────────────────────────────────────
  # EXACT NUMERIC TYPES
  # ──────────────────────────────────────────────

  - id: TY-005
    dimension: Types
    name: Map DECIMAL/NUMERIC to DECIMAL
    intent: >
      Convert SQL Server DECIMAL(p,s) / NUMERIC(p,s) to Spark SQL DECIMAL(p,s),
      preserving precision and scale exactly. Evidenced on
      `Warehouse.StockItems.UnitPrice` / `Dimension.Stock Item.UnitPrice` and
      `Purchasing.PurchaseOrderLines.ExpectedUnitPricePerOuter`.
    activation:
      preconditions:
        - Column or expression declared as DECIMAL(p,s) or NUMERIC(p,s) in source DDL.
      scope: project
    transformation:
      source: "DECIMAL(p,s) / NUMERIC(p,s)"
      target: "DECIMAL(p,s)"
      algorithm:
        - "Normalise NUMERIC to DECIMAL in generated DDL; retain precision (p) and scale (s) unchanged."
        - "Where p > 38, cap at DECIMAL(38,s) and log a warning — Spark SQL maximum precision is 38."
        - "Unqualified DECIMAL defaults to DECIMAL(10,0) in SQL Server; carry that default forward explicitly."
    validation:
      success_criteria:
        - Precision and scale are preserved in all generated DECIMAL columns.
        - No silent rounding occurs during data load.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "unit_price DECIMAL(18,2)"
          expected: "unit_price DECIMAL(18,2)"
          notes: "Evidenced: Dimension.Stock Item / Warehouse.StockItems UnitPrice."
        - input: "expected_unit_price_per_outer DECIMAL(18,2)"
          expected: "expected_unit_price_per_outer DECIMAL(18,2)"
          notes: "Evidenced: Purchasing.PurchaseOrderLines.ExpectedUnitPricePerOuter."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false

  - id: TY-006
    dimension: Types
    name: Map MONEY to DECIMAL(19,4)
    intent: >
      Convert SQL Server MONEY to DECIMAL(19,4) in Spark SQL to preserve monetary
      precision without relying on a proprietary type. No MONEY column is evidenced
      in the Purchases as-is analysis (monetary values there use plain DECIMAL —
      see TY-005); retained as a baseline platform-level mapping.
    activation:
      preconditions:
        - Column declared as MONEY in source DDL.
      scope: project
    transformation:
      source: "MONEY"
      target: "DECIMAL(19,4)"
      algorithm:
        - "Replace MONEY with DECIMAL(19,4) in all generated DDL and CAST expressions."
        - "Ensure ETL pipelines do not introduce floating-point intermediaries that would corrupt the 4-decimal precision."
    validation:
      success_criteria:
        - All MONEY columns replaced by DECIMAL(19,4) in generated DDL.
        - No floating-point rounding artifacts present in target data.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "total_amount MONEY"
          expected: "total_amount DECIMAL(19,4)"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if MONEY never appears in Purchasing_Project scope."

  - id: TY-007
    dimension: Types
    name: Map SMALLMONEY to DECIMAL(10,4)
    intent: >
      Convert SQL Server SMALLMONEY to DECIMAL(10,4) in Spark SQL. No SMALLMONEY
      column is evidenced in the Purchases as-is analysis; retained as a baseline
      platform-level mapping.
    activation:
      preconditions:
        - Column declared as SMALLMONEY in source DDL.
      scope: project
    transformation:
      source: "SMALLMONEY"
      target: "DECIMAL(10,4)"
      algorithm:
        - "Replace SMALLMONEY with DECIMAL(10,4) in all generated DDL and CAST expressions."
        - "Verify source data stays within ±214,748.3648; if overflow is detected in profiling, upcast to DECIMAL(19,4) and log a warning."
    validation:
      success_criteria:
        - All SMALLMONEY columns replaced by DECIMAL(10,4) in generated DDL.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "discount_amount SMALLMONEY"
          expected: "discount_amount DECIMAL(10,4)"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if SMALLMONEY never appears in Purchasing_Project scope."

  # ──────────────────────────────────────────────
  # FLOATING POINT TYPES
  # ──────────────────────────────────────────────

  - id: TY-008
    dimension: Types
    name: Map FLOAT to DOUBLE
    intent: >
      Convert SQL Server FLOAT / FLOAT(n>24) to Spark SQL DOUBLE. No FLOAT column
      is evidenced in the Purchases as-is analysis; retained as a baseline
      platform-level mapping.
    activation:
      preconditions:
        - Column or variable declared as FLOAT or FLOAT(n) where n > 24 in source DDL.
      scope: project
    transformation:
      source: "FLOAT / FLOAT(n) where n in [25..53]"
      target: "DOUBLE"
      algorithm:
        - "Replace FLOAT and FLOAT(53) with DOUBLE in all generated DDL."
        - "FLOAT(n) where n ≤ 24 maps to FLOAT (single precision) — see TY-009."
        - "CAST(x AS FLOAT) rewrites to CAST(x AS DOUBLE)."
    validation:
      success_criteria:
        - FLOAT columns appear as DOUBLE in generated Delta DDL.
      quality_dimensions:
        - accuracy
        - conformity
      test_cases:
        - input: "measurement FLOAT"
          expected: "measurement DOUBLE"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: false
      deactivate: "May be deactivated if FLOAT never appears in Purchasing_Project scope."

  - id: TY-009
    dimension: Types
    name: Map REAL / FLOAT(n<=24) to FLOAT
    intent: >
      Convert SQL Server REAL / FLOAT(n≤24) to Spark SQL FLOAT. No REAL column is
      evidenced in the Purchases as-is analysis; retained as a baseline
      platform-level mapping.
    activation:
      preconditions:
        - Column declared as REAL or FLOAT(n) where n ≤ 24 in source DDL.
      scope: project
    transformation:
      source: "REAL / FLOAT(n) where n in [1..24]"
      target: "FLOAT"
      algorithm:
        - "Replace REAL and FLOAT(n≤24) with FLOAT in generated DDL."
        - "CAST(x AS REAL) rewrites to CAST(x AS FLOAT)."
    validation:
      success_criteria:
        - REAL columns appear as FLOAT in generated Delta DDL.
      quality_dimensions:
        - accuracy
        - conformity
      test_cases:
        - input: "weight REAL"
          expected: "weight FLOAT"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: false
      deactivate: "May be deactivated if REAL never appears in Purchasing_Project scope."

  # ──────────────────────────────────────────────
  # STRING TYPES
  # ──────────────────────────────────────────────

  - id: TY-010
    dimension: Types
    name: Map CHAR/NCHAR to STRING
    intent: >
      Convert fixed-length character types CHAR(n)/NCHAR(n) to Spark SQL STRING.
      No CHAR/NCHAR column is evidenced in the Purchases as-is analysis (all
      character columns evidenced there are NVARCHAR — see TY-011); retained as a
      baseline platform-level mapping.
    activation:
      preconditions:
        - Column declared as CHAR(n) or NCHAR(n) in source DDL.
      scope: project
    transformation:
      source: "CHAR(n) / NCHAR(n)"
      target: "STRING"
      algorithm:
        - "Replace CHAR(n) and NCHAR(n) with STRING in generated DDL."
        - "In ETL pipelines, apply RTRIM() to source values to remove SQL Server fixed-length padding before writing to Delta."
        - "Document original length constraint in column metadata/comments for reference."
    validation:
      success_criteria:
        - All CHAR/NCHAR columns appear as STRING in generated Delta DDL.
        - Trailing spaces stripped from all migrated string values.
      quality_dimensions:
        - conformity
        - validity
        - accuracy
      test_cases:
        - input: "country_code CHAR(10)"
          expected: "country_code STRING"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if CHAR/NCHAR never appears in Purchasing_Project scope."

  - id: TY-011
    dimension: Types
    name: Map VARCHAR/NVARCHAR to STRING
    intent: >
      Convert variable-length character types VARCHAR(n)/NVARCHAR(n)/NVARCHAR(MAX)
      to Spark SQL STRING. Extensively evidenced across Purchases: `Supplier
      Reference` (NVARCHAR(40)), `Description` (NVARCHAR(200)), `Stock Item Name` /
      `Stock Item` (NVARCHAR(200)), `Package Type Name` / `Package`
      (NVARCHAR(100)), `Supplier` (NVARCHAR(200)), `Category` (NVARCHAR(100)),
      `Primary Contact` (NVARCHAR(100)), `Postal Code` (NVARCHAR(20)), `Color`
      (NVARCHAR(40)), `Selling Package` (NVARCHAR(100)), `Brand` (NVARCHAR(100)),
      `Day` (NVARCHAR(20)).
    activation:
      preconditions:
        - Column declared as VARCHAR(n), VARCHAR(MAX), NVARCHAR(n), or NVARCHAR(MAX)
          in source DDL.
      scope: project
    transformation:
      source: "VARCHAR(n) / VARCHAR(MAX) / NVARCHAR(n) / NVARCHAR(MAX)"
      target: "STRING"
      algorithm:
        - "Replace all VARCHAR and NVARCHAR variants with STRING in generated DDL."
        - "Record original length constraints in column-level metadata for downstream governance."
        - "CAST(x AS VARCHAR(n)) rewrites to CAST(x AS STRING)."
    validation:
      success_criteria:
        - All VARCHAR/NVARCHAR columns appear as STRING in generated Delta DDL.
        - No data is truncated during migration.
      quality_dimensions:
        - conformity
        - completeness
        - validity
      test_cases:
        - input: "package NVARCHAR(100)"
          expected: "package STRING"
          notes: "Evidenced: Fact.Purchase / Purchase_Staging Package."
        - input: "supplier NVARCHAR(200)"
          expected: "supplier STRING"
          notes: "Evidenced: Dimension.Supplier.Supplier."
        - input: "supplier_reference NVARCHAR(40)"
          expected: "supplier_reference STRING"
          notes: "Evidenced: Purchasing.PurchaseOrders / Dimension.Supplier SupplierReference."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false

  # ──────────────────────────────────────────────
  # DATE / TIME TYPES
  # ──────────────────────────────────────────────

  - id: TY-012
    dimension: Types
    name: Map DATE to DATE
    intent: >
      Preserve SQL Server DATE as Spark SQL DATE. Evidenced on `Order Date`,
      `Expected Delivery Date`, `Last Receipt Date`, `Date Key` (staging and fact),
      and `Dimension.Date.Date`.
    activation:
      preconditions:
        - Column declared as DATE in source DDL.
      scope: project
    transformation:
      source: "DATE"
      target: "DATE"
      algorithm:
        - "Retain DATE keyword verbatim in generated DDL."
        - "Verify ETL pipelines read the source as DateType — not TIMESTAMP — to avoid accidental time-zone shifts."
    validation:
      success_criteria:
        - All DATE columns appear as DATE in generated Delta DDL.
        - No time component introduced in target data.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "date_key DATE NOT NULL"
          expected: "date_key DATE NOT NULL"
          notes: "Evidenced: Fact.Purchase / Purchase_Staging Date Key, per as-is 3.1 and §9 risk 3/5 (pre-resolved, no load-time lookup against Dimension.Date)."
        - input: "order_date DATE"
          expected: "order_date DATE"
          notes: "Evidenced: Purchasing.PurchaseOrders.OrderDate."
    inheritance:
      level: project
      override: false
      extend: false
      deactivate: false

  - id: TY-013
    dimension: Types
    name: Map TIME to STRING with documented precision
    intent: >
      Convert SQL Server TIME(n) to STRING, since Spark has no native
      time-of-day type. No TIME column is evidenced in the Purchases as-is
      analysis; retained as a baseline platform-level mapping.
    activation:
      preconditions:
        - Column declared as TIME or TIME(n) in source DDL.
      scope: project
    transformation:
      source: "TIME(n)"
      target: "STRING"
      algorithm:
        - "Replace TIME(n) with STRING in generated DDL."
        - "In ETL pipelines, format source TIME values as ISO 8601 strings ('HH:mm:ss.nnnnnnn') using the source n precision."
    validation:
      success_criteria:
        - All TIME columns appear as STRING in generated Delta DDL.
        - Stored strings conform to 'HH:mm:ss.n' ISO 8601 format.
      quality_dimensions:
        - conformity
        - accuracy
        - validity
      test_cases:
        - input: "shift_start TIME(7)"
          expected: "shift_start STRING  -- original: TIME(7)"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if TIME never appears in Purchasing_Project scope."

  - id: TY-014
    dimension: Types
    name: Map DATETIME to TIMESTAMP
    intent: >
      Convert SQL Server plain DATETIME (~3.33 ms precision, no time-zone
      awareness) to Spark SQL TIMESTAMP. No plain-DATETIME column is evidenced in
      the Purchases as-is analysis (all evidenced timestamp columns are
      DATETIME2 — see TY-015); retained as a baseline platform-level mapping.
    activation:
      preconditions:
        - Column declared as DATETIME in source DDL.
      scope: project
    transformation:
      source: "DATETIME"
      target: "TIMESTAMP"
      algorithm:
        - "Replace DATETIME with TIMESTAMP in generated DDL."
        - "In ETL pipelines, interpret source DATETIME values as local server time and convert to UTC using the source server's documented time-zone offset."
    validation:
      success_criteria:
        - All DATETIME columns appear as TIMESTAMP in generated Delta DDL.
        - UTC conversion applied consistently across all rows.
      quality_dimensions:
        - accuracy
        - conformity
        - consistency
      test_cases:
        - input: "created_at DATETIME"
          expected: "created_at TIMESTAMP"
          notes: "No current evidence in Purchases as-is; baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if plain DATETIME never appears in Purchasing_Project scope."

  - id: TY-015
    dimension: Types
    name: Map DATETIME2 to TIMESTAMP_NTZ
    intent: >
      Convert SQL Server DATETIME2(n) to Spark SQL TIMESTAMP_NTZ, preserving
      wall-clock semantics without imposing UTC conversion. Evidenced on
      `Last Edited When` (source orders/lines), `Valid From` / `Valid To`
      (the SCD2 validity windows on `Dimension.Supplier` and
      `Dimension.Stock Item`), and `Last Modified When` (staging).
    activation:
      preconditions:
        - Column declared as DATETIME2 or DATETIME2(n) in source DDL.
      scope: project
    transformation:
      source: "DATETIME2(n)"
      target: "TIMESTAMP_NTZ"
      algorithm:
        - "Replace DATETIME2(n) with TIMESTAMP_NTZ in generated DDL (Databricks Runtime 10.4+)."
        - "Where TIMESTAMP_NTZ is unavailable, fall back to TIMESTAMP with a documented UTC-assumed convention and note the downgrade."
        - "Fractional seconds precision up to microseconds (6 digits) is preserved; 100 ns precision of DATETIME2(7) truncates to microseconds — log the truncation."
    validation:
      success_criteria:
        - All DATETIME2 columns appear as TIMESTAMP_NTZ in generated Delta DDL.
        - No implicit time-zone conversion applied.
        - Precision truncation (100 ns → 1 µs) is logged when it occurs.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "valid_from DATETIME2(7)"
          expected: "valid_from TIMESTAMP_NTZ"
          notes: "Evidenced: Dimension.Supplier / Dimension.Stock Item Valid From, used by the SCD2 valid-time lookups in Integration.MigrateStagedPurchaseData."
        - input: "last_modified_when DATETIME2(7)"
          expected: "last_modified_when TIMESTAMP_NTZ"
          notes: "Evidenced: Integration.Purchase_Staging Last Modified When."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false

  - id: TY-016
    dimension: Types
    name: Map SMALLDATETIME to TIMESTAMP
    intent: >
      Convert SQL Server SMALLDATETIME (1-minute precision) to Spark SQL
      TIMESTAMP. No SMALLDATETIME column is evidenced in the Purchases as-is
