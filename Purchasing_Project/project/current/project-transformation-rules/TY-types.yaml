  - id: TY-023
    dimension: Types
    name: Map IDENTITY columns to Delta Lake GENERATED ALWAYS AS IDENTITY
    intent: >
      Replace SQL Server IDENTITY(seed, increment) auto-increment column property
      with Delta Lake's native GENERATED ALWAYS AS IDENTITY clause. Evidenced on
      `Fact.Purchase.Purchase Key`, which the Purchases as-is model (§3.2)
      explicitly documents as an IDENTITY column (composite PK with `Date Key`).
    activation:
      preconditions:
        - Column has the IDENTITY(seed, increment) property in source DDL.
        - Column type is INT or BIGINT.
      scope: project
    transformation:
      source: "col INT|BIGINT IDENTITY(seed, increment)"
      target: "col BIGINT GENERATED ALWAYS AS IDENTITY (START WITH seed INCREMENT BY increment)"
      algorithm:
        - "Detect IDENTITY(seed, increment) property on INT or BIGINT columns."
        - "In the Delta CREATE TABLE DDL, replace with GENERATED ALWAYS AS IDENTITY (START WITH <seed> INCREMENT BY <increment>)."
        - "Upcast INT IDENTITY to BIGINT to accommodate future growth (recommended best practice on Databricks)."
        - "During full-load migration, temporarily use GENERATED BY DEFAULT AS IDENTITY to bulk-insert historical key values, then switch to GENERATED ALWAYS AS IDENTITY for ongoing inserts."
        - "Document the original IDENTITY seed/increment and any re-keying decisions."
    validation:
      success_criteria:
        - IDENTITY columns appear with GENERATED ALWAYS AS IDENTITY in Delta DDL.
        - Historical key values are either preserved or re-keyed with full RI update.
        - No duplicate key values generated after migration.
      quality_dimensions:
        - uniqueness
        - conformity
        - validity
        - consistency
      test_cases:
        - input: "purchase_key BIGINT IDENTITY(1,1) NOT NULL"
          expected: "purchase_key BIGINT GENERATED ALWAYS AS IDENTITY (START WITH 1 INCREMENT BY 1) NOT NULL"
          notes: "Evidenced: Fact.Purchase Purchase Key, per Purchases as-is §3.2."
        - input: "INSERT without explicit key value"
          expected: "Row inserted with next IDENTITY value in sequence"
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false

  - id: TY-024
    dimension: Types
    name: Replace SQL Server SEQUENCE objects with Delta Lake IDENTITY or Python counter
    intent: >
      Replace SQL Server SEQUENCE objects with an appropriate Databricks-native
      counter mechanism. Directly evidenced by `sequences.lineagekey`, explicitly
      catalogued as an in-scope object in modernization-plan.md §6.4 and consumed
      by `Integration.MigrateStagedPurchaseData`'s `Lineage Key` bookkeeping
      (per Purchases as-is §5.4). The Purchases as-is model (§3.2) also documents
      that `Dimension.Supplier` and `Dimension.Stock Item` surrogate keys are
      SEQUENCE-generated (`Sequences.SupplierKey`, `Sequences.StockItemKey`)
      even though those two sequence objects are not individually listed in
      modernization-plan.md §6.4 — flagged here for addition to that inventory,
      consistent with how the as-is analysis flagged the `wwidw-ordered-by-supplier`
      report as a scope-inventory gap.
    activation:
      preconditions:
        - "A SQL Server SEQUENCE object exists in scope (identified in modernization-plan.md §6.4: sequences.lineagekey)."
        - "The Purchases as-is analysis (§3.2) additionally evidences SEQUENCE-generated surrogate keys for Dimension.Supplier and Dimension.Stock Item, not yet individually catalogued at project level."
        - The sequence is referenced via NEXT VALUE FOR in T-SQL stored procedures
          or DML statements.
      scope: project
    transformation:
      source: "CREATE SEQUENCE <schema>.<name> AS <type> START WITH <n> INCREMENT BY <m>"
      target: >
        Option A (single-table use): BIGINT GENERATED ALWAYS AS IDENTITY on the
        consuming table column.
        Option B (multi-table / cross-pipeline use, applies to sequences.lineagekey
        which is shared cross-cutting ETL infrastructure per modernization-plan.md
        §6.3): Python counter using delta.tables.DeltaTable with a dedicated
        sequence-tracking table (schema: seq_name STRING PK, next_val BIGINT) with
        optimistic locking.
      algorithm:
        - "For sequences.lineagekey: determine all NEXT VALUE FOR sequences.lineagekey call sites; since it is shared cross-cutting ETL infrastructure (not single-table), create a migvisor_sequences Delta table (seq_name STRING, next_val BIGINT) with a get_next_val(seq_name) Python helper using Delta optimistic concurrency."
        - "For Dimension.Supplier / Dimension.Stock Item surrogate-key sequences: confirm with the project/product owner whether each feeds exactly one table; if so, convert to GENERATED ALWAYS AS IDENTITY on that dimension's surrogate key column, otherwise apply the shared-counter pattern as for sequences.lineagekey."
        - "Remove all NEXT VALUE FOR references in migrated T-SQL/procedure code and replace with the chosen pattern."
        - "Initialise the replacement counter at the current max value from the source to avoid collisions with existing data."
    validation:
      success_criteria:
        - No CREATE SEQUENCE DDL in generated migration output.
        - All NEXT VALUE FOR call sites replaced with the chosen Databricks pattern.
        - Generated key values are unique and monotonically increasing after migration.
        - No collision between historical keys loaded during migration and new keys
          generated post-migration.
      quality_dimensions:
        - uniqueness
        - validity
        - consistency
        - conformity
      test_cases:
        - input: "CREATE SEQUENCE sequences.lineagekey AS INT START WITH 1 INCREMENT BY 1"
          expected: "No SEQUENCE DDL; migvisor_sequences Delta table + get_next_val('lineagekey') Python helper, consumed by the migrated Fact.Purchase load pipeline"
          notes: "Evidenced: modernization-plan.md §6.4 in-scope sequence; consumed per Purchases as-is §5.4."
        - input: "SELECT TOP(1) [Lineage Key] FROM Integration.Lineage WHERE [Table Name] = N'Purchase' AND [Data Load Completed] IS NULL ORDER BY [Lineage Key] DESC"
          expected: "get_next_val('lineagekey') or equivalent Delta-native batch-key retrieval"
          notes: "Evidenced verbatim pattern from Integration.MigrateStagedPurchaseData, per Purchases as-is §5.4."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false

