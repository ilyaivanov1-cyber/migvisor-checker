  - id: TY-028
    dimension: Types
    name: Translate SQL Server DEFAULT constraint values to Spark SQL DDL defaults
    intent: >
      Convert SQL Server DEFAULT constraint expressions to their Spark SQL
      equivalents in Delta table DDL. No explicit DEFAULT constraint is evidenced
      in the Purchases as-is analysis (the ETL bookkeeping calls to SYSDATETIME()
      documented in §5.4 are procedural UPDATE statements inside
      `Integration.MigrateStagedPurchaseData`, not DDL DEFAULT clauses); retained
      as a baseline platform-level mapping. Note the NEXT VALUE FOR case is
      already handled by TY-024.
    activation:
      preconditions:
        - Column has a DEFAULT constraint in source DDL.
      scope: project
    transformation:
      source: "col <type> DEFAULT <expression>"
      target: "col <mapped_type> DEFAULT <spark_expression>"
      algorithm:
        - "Map common SQL Server DEFAULT expressions to Spark SQL equivalents: DEFAULT 0/1 → DEFAULT 0/1; DEFAULT ''/N'' → DEFAULT ''; DEFAULT GETDATE()/GETUTCDATE()/SYSDATETIME() → DEFAULT current_timestamp(); DEFAULT NEWID() → DEFAULT uuid()."
        - "DEFAULT (NEXT VALUE FOR <seq>) is handled by TY-024, not this rule."
        - "For complex expressions not directly mappable, generate a comment in the DDL and implement the logic in the ETL pipeline's INSERT statement instead."
    validation:
      success_criteria:
        - Simple DEFAULT values (literals, GETDATE, NEWID) mapped correctly.
        - Complex expressions flagged and implemented in ETL with DDL comment.
      quality_dimensions:
        - conformity
        - accuracy
        - validity
      test_cases:
        - input: "created_at DATETIME2 DEFAULT SYSDATETIME()"
          expected: "created_at TIMESTAMP_NTZ DEFAULT current_timestamp()"
          notes: "No current evidence of a DDL DEFAULT clause in Purchases as-is (SYSDATETIME() there is a procedural bookkeeping call, per §5.4); baseline mapping."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if no DDL DEFAULT constraint is ever confirmed in Purchasing_Project scope."

  - id: TY-029
    dimension: Types
    name: Convert SQL Server computed columns to Delta Lake GENERATED columns
    intent: >
      Replace SQL Server computed column definitions (col AS <expression>) with
      Delta Lake GENERATED ALWAYS AS (<expression>) columns. No persisted DDL
      computed column is evidenced in the Purchases as-is analysis — `Ordered
      Quantity` (= `Ordered Outers` × `Quantity Per Outer`) is computed
      procedurally in `Integration.GetPurchaseUpdates`'s extraction SELECT, not
      as a table-level computed column (per as-is §4.1/§5.1); retained as a
      baseline platform-level mapping and to explicitly document that this
      rule does not apply to `Ordered Quantity`.
    activation:
      preconditions:
        - Table contains one or more computed columns defined with AS <expression>
          in source DDL.
        - The expression is deterministic (no RAND(), NEWID(), or non-deterministic
          functions).
      scope: project
    transformation:
      source: "col <type> AS <sql_server_expression> [PERSISTED]"
      target: "col <mapped_type> GENERATED ALWAYS AS (<spark_expression>)"
      algorithm:
        - "Extract the computation expression from the source DDL."
        - "Translate T-SQL expression functions to Spark SQL equivalents (e.g. ISNULL → COALESCE)."
        - "Generate Delta DDL: GENERATED ALWAYS AS (<translated_expression>)."
        - "If the expression is non-deterministic or too complex to translate, remove from DDL and implement as a derived column in the ETL pipeline with a migration note — this is the applicable path for Ordered Quantity, which stays an ETL-computed pass-through column rather than a Delta GENERATED column."
    validation:
      success_criteria:
        - All deterministic computed columns appear as GENERATED ALWAYS AS in Delta DDL.
        - Non-translatable/non-DDL-sourced expressions (e.g. Ordered Quantity) are flagged and implemented in ETL instead.
      quality_dimensions:
        - accuracy
        - conformity
        - validity
      test_cases:
        - input: "ordered_quantity AS (OrderedOuters * QuantityPerOuter) -- NOT a DDL computed column in source; computed in Integration.GetPurchaseUpdates SELECT"
          expected: "ordered_quantity INT -- ETL-computed pass-through column, populated by the migrated extraction pipeline; no Delta GENERATED ALWAYS AS clause, since the source never declared it as a table-level computed column"
          notes: "Evidenced: Purchases as-is §4.1/§5.1 Ordered Quantity calculation; documents why this rule's GENERATED-column path does not apply here."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
