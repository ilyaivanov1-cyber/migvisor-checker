  # ──────────────────────────────────────────────
  # COLLATION HANDLING
  # ──────────────────────────────────────────────

  - id: TY-027
    dimension: Types
    name: Resolve SQL Server collation to Spark UTF-8 default
    intent: >
      Remove SQL Server column-level/database-level collation specifications when
      generating Spark SQL DDL, since Spark uses a single session-level UTF-8
      collation. No explicit non-default COLLATE clause is evidenced on any
      NVARCHAR column in the Purchases as-is analysis; retained as a baseline
      platform-level mapping applicable to the many NVARCHAR columns evidenced
      under TY-011, in case any carries a non-default collation not surfaced by
      the as-is analysis.
    activation:
      preconditions:
        - Column has an explicit COLLATE clause in source DDL, or source database
          uses a non-default collation that affects sort/comparison semantics.
      scope: project
    transformation:
      source: "col NVARCHAR(n) COLLATE <CollationName>"
      target: "col STRING  -- collation resolved to Spark UTF-8 session default"
      algorithm:
        - "Strip COLLATE clauses from all generated Spark DDL."
        - "Identify case-insensitive collations (_CI_) in source and rewrite case-insensitive comparisons using LOWER()/UPPER() where exact semantic parity is required; log affected query locations."
        - "Identify binary collations (_BIN, _BIN2) and flag for explicit CAST or hex-comparison rewrites."
        - "Verify sort orders for ORDER BY on string columns match expectations."
    validation:
      success_criteria:
        - No COLLATE clauses appear in generated Delta DDL.
        - Case-insensitive comparison logic identified and rewritten where required.
      quality_dimensions:
        - conformity
        - accuracy
        - consistency
        - validity
      test_cases:
        - input: "supplier NVARCHAR(200) COLLATE SQL_Latin1_General_CP1_CI_AS"
          expected: "supplier STRING  -- COLLATE removed; UTF-8 default applied"
          notes: "No current evidence of an explicit COLLATE clause in Purchases as-is; baseline mapping applied preventively to evidenced NVARCHAR columns such as Supplier."
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: "May be deactivated if no non-default collation is ever confirmed in Purchasing_Project scope."

