  - id: TY-026
    dimension: Types
    name: Type mapping for dimension.date calendar table
    intent: >
      Apply the correct column type mappings for the dimension.date static calendar
      table. This is a shared infrastructure table used as an FK target for the
      Date Key column in fact.purchase. Its type surface covers DATE (PK), INT
      (integer calendar keys and numbers), and NVARCHAR (label strings).
      Accurate type mapping is required to preserve FK referential integrity and
      correct calendar attribute resolution in BI reports.
    activation:
      preconditions:
        - dimension.date is in scope as an FK target and shared infrastructure table.
      scope: project
    transformation:
      source: >
        dimension.date: Date DATE PK, DateKey INT, CalendarYear INT,
        CalendarYearLabel NVARCHAR(10), CalendarMonthNumber INT,
        CalendarMonthLabel NVARCHAR(10), FiscalYear INT, FiscalYearLabel NVARCHAR(10),
        ISOWeekNumber INT, ShortMonth NVARCHAR(3), Day NVARCHAR(10), DayNumber INT
      target: >
        date: date DATE NOT NULL, date_key INT, calendar_year INT,
        calendar_year_label STRING, calendar_month_number INT,
        calendar_month_label STRING, fiscal_year INT, fiscal_year_label STRING,
        iso_week_number INT, short_month STRING, day STRING, day_number INT
      algorithm: >
        Apply TY-010 (DATE → DATE) to the Date PK column. Apply TY-003 (INT → INT)
        to all integer key and number columns. Apply TY-009 (NVARCHAR → STRING) to
        all label and name columns. Rename columns to snake_case per NM convention.
        Ensure that the fact.purchase date_key FK join to dimension.date is rewritten
        to use the correct Spark column names after renaming.
    validation:
      success_criteria:
        - dimension.date date column is DATE type in Delta DDL.
        - All INT calendar key columns are INT in Delta DDL.
        - All NVARCHAR label columns are STRING in Delta DDL.
        - FK join from fact.purchase to dimension.date resolves correctly.
      quality_dimensions:
        - conformity
        - validity
      test_cases:
        - description: "dimension.date fully mapped."
          input: "Date DATE NOT NULL, DateKey INT, CalendarYearLabel NVARCHAR(10)"
          expected: "date DATE NOT NULL, date_key INT, calendar_year_label STRING"
    inheritance:
      level: project
      override: false
      extend: false
      deactivate: false
