dimension: Objects
prefix: OB
product: Purchase
inherits_from: Inventory_Stock_Project
generated: "2026-09-07"

# ── INHERITED PROJECT RULES ──────────────────────────────────
rules:

  - id: OB-001
    dimension: Objects
    name: SCD-2 Dimension Tables to Delta Lake Managed Tables with _current Views
    intent: >
      Migrate the two SCD Type-2 conformed dimension tables (dimension.supplier and
      dimension.[stock item]) from SQL Server to Delta Lake managed tables in the
      inventory_stock.silver_dim schema, preserving the Valid From / Valid To / Is Current
      SCD-2 pattern, renaming the space-bearing object dimension.[stock item] to
      silver_dim.stock_item, and providing a _current view over each dimension for
      efficient surrogate key lookups in the Purchase ETL.
    activation:
      preconditions:
        - Source object is a table residing in the SQL Server dimension schema
        - Table name matches one of: supplier, stock item (space-in-name variant)
        - Table carries SCD-2 columns: Valid From (datetime2), Valid To (datetime2)
        - Unity Catalog catalog inventory_stock and schema inventory_stock.silver_dim exist
      scope: project
    transformation:
      source:
        object_type: TABLE
        schema_pattern: "dimension.supplier | dimension.[stock item]"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: DELTA_MANAGED_TABLE
        schema: "inventory_stock.silver_dim"
        naming_convention: "inventory_stock.silver_dim.<snake_case_table_name>"
        platform: "Databricks (Delta Lake)"
        properties:
          - delta.enableChangeDataFeed = true
          - delta.minReaderVersion = 2
          - delta.minWriterVersion = 5
          - TBLPROPERTIES layer = 'silver_dim'
    algorithm: >
      1. Map source tables to target names (snake_case, strip schema prefix, remove spaces):
         - dimension.supplier          → inventory_stock.silver_dim.supplier
         - dimension.[stock item]      → inventory_stock.silver_dim.stock_item
      2. Translate all column data types per the TY (Types) dimension rules; preserve
         Valid From / Valid To as TIMESTAMP (from datetime2); retain Is Current as BOOLEAN.
      3. Convert IDENTITY int surrogate key to INT GENERATED ALWAYS AS IDENTITY in the DDL.
      4. Retain the SCD-2 pattern: Valid_From TIMESTAMP NOT NULL, Valid_To TIMESTAMP NOT NULL,
         Is_Current BOOLEAN NOT NULL. No structural refactoring of the SCD-2 design.
      5. Rename space-in-name column references: [stock item] → stock_item throughout all
         DDL, ETL code, and BI query objects.
      6. Create a companion _current view (CREATE VIEW silver_dim.supplier_current AS
         SELECT * FROM silver_dim.supplier WHERE is_current = TRUE) for each SCD-2
         dimension to simplify surrogate key lookups in the Purchase ETL notebook.
      7. Set delta.enableChangeDataFeed = true to support incremental SCD-2 processing.
      8. Register both tables and views in Unity Catalog; grant SELECT to the ETL service
         principal and the BI service principal group.
      9. Emit CREATE TABLE … USING DELTA and CREATE VIEW … statements in generated DDL files.
    validation:
      success_criteria:
        - Both target tables (supplier, stock_item) exist in inventory_stock.silver_dim
        - Companion _current views (supplier_current, stock_item_current) exist and
          return only rows where is_current = TRUE
        - No space characters appear in any object name in the target catalog
        - Row counts in target tables match source counts post initial dimension load
        - Valid_From / Valid_To columns present with TIMESTAMP type; Is_Current is BOOLEAN
        - SCD-2 uniqueness: for any given natural key only one row where is_current = TRUE
      quality_dimensions:
        - completeness
        - accuracy
        - conformity
        - uniqueness
      test_cases:
        - name: dim_table_existence
          description: >
            Assert inventory_stock.silver_dim.supplier and
            inventory_stock.silver_dim.stock_item exist
          expected: Both tables present in Unity Catalog
        - name: dim_current_view_existence
          description: >
            Assert supplier_current and stock_item_current views exist and
            return is_current = TRUE rows only
          expected: Views present; SELECT COUNT(*) WHERE is_current = FALSE returns 0
        - name: dim_no_space_in_names
          description: >
            Inspect Unity Catalog column and table names for space characters
          expected: 0 object names containing spaces
        - name: dim_row_count_match
          description: >
            Compare source vs target row counts for each dimension table post load
          expected: Delta <= 0 rows discrepancy
        - name: dim_scd2_current_uniqueness
          description: >
            For each natural key (wwiSupplierID / wwiStockItemID) assert at most one
            row with is_current = TRUE
          expected: COUNT(*) = COUNT(DISTINCT <natural_key>) on the _current view
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
      product_status: EXTENDED   # by OB-P001 — key=0 sentinel bootstrap MERGE notebook required for each SCD-2 dimension

  - id: OB-002
    dimension: Objects
    name: Fact Table (fact.purchase) to Delta Lake Managed Table in silver_fact
    intent: >
      Migrate fact.purchase from SQL Server to a Delta Lake managed table in
      inventory_stock.silver_fact, replacing the BIGINT IDENTITY surrogate key
      (PurchaseKey) with BIGINT GENERATED ALWAYS AS IDENTITY, applying CLUSTER BY on
      high-cardinality FK and date columns, and enabling optimized write to reduce
      small-file accumulation from the daily incremental upsert pattern.
    activation:
      preconditions:
        - Source object is fact.purchase in the SQL Server fact schema
        - Unity Catalog catalog inventory_stock and schema inventory_stock.silver_fact exist
      scope: project
    transformation:
      source:
        object_type: TABLE
        schema_pattern: "fact.purchase"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: DELTA_MANAGED_TABLE
        schema: "inventory_stock.silver_fact"
        naming_convention: "inventory_stock.silver_fact.purchase"
        platform: "Databricks (Delta Lake)"
        properties:
          - delta.enableChangeDataFeed = false
          - delta.autoOptimize.optimizeWrite = true
          - delta.autoOptimize.autoCompact = true
          - TBLPROPERTIES layer = 'silver_fact'
          - CLUSTER BY (date_key, supplier_key, stock_item_key)
    algorithm: >
      1. Map fact.purchase → inventory_stock.silver_fact.purchase (snake_case columns;
         strip brackets from column names: [Date Key] → date_key, [Supplier Key] →
         supplier_key, etc.).
      2. Replace BIGINT IDENTITY PK (PurchaseKey) with BIGINT GENERATED ALWAYS AS IDENTITY
         in the CREATE TABLE DDL. Retain purchase_key as the primary surrogate key column.
      3. Translate all column data types per TY dimension rules (see type mapping):
         - int → INT; bigint → BIGINT; nvarchar(50) → STRING; bit → BOOLEAN;
           date → DATE; datetime2 → TIMESTAMP.
      4. Do NOT enforce FOREIGN KEY constraints; document referential relationships as
         data quality expectations and Delta table comments.
      5. Apply CLUSTER BY (date_key, supplier_key, stock_item_key) using Liquid Clustering
         (Databricks Runtime 13.3+) or Z-ORDER in OPTIMIZE for earlier runtimes, to optimise
         the supplier performance and stock-item cross-domain BI query patterns.
      6. Set delta.autoOptimize.optimizeWrite = true and delta.autoOptimize.autoCompact = true
         to manage small files from the daily incremental order-level delete+insert pattern.
      7. Add standard audit columns: load_timestamp TIMESTAMP DEFAULT current_timestamp(),
         etl_run_id STRING to replace the lineage_key FK with a portable run identifier.
      8. Emit CREATE TABLE … USING DELTA statement in generated DDL.
    validation:
      success_criteria:
        - inventory_stock.silver_fact.purchase exists in Unity Catalog
        - purchase_key column has GENERATED ALWAYS AS IDENTITY; no manual IDENTITY inserts
        - All 11 source columns mapped with correct target data types
        - No FOREIGN KEY constraint DDL present in the target table definition
        - Row counts match source post initial full load
        - Cluster / Z-ORDER applied on date_key, supplier_key, stock_item_key
      quality_dimensions:
        - completeness
        - accuracy
        - conformity
        - uniqueness
      test_cases:
        - name: fact_table_existence
          description: Assert inventory_stock.silver_fact.purchase exists
          expected: Table present in Unity Catalog
        - name: fact_identity_column
          description: >
            Assert purchase_key column has GENERATED ALWAYS AS IDENTITY in table DDL
          expected: IDENTITY attribute present on purchase_key
        - name: fact_row_count_match
          description: Compare source vs target row counts post initial full load
          expected: Zero discrepancy
        - name: fact_fk_referential_check
          description: >
            Left-join supplier_key and stock_item_key to their respective dimension
            _current views; assert no orphaned keys beyond key=0 sentinel rows
          expected: 0 orphaned FK values excluding the key=0 unknown sentinel
        - name: fact_cluster_columns
          description: >
            Run EXPLAIN on a query filtering by date_key and supplier_key;
            assert partition or cluster pruning is applied
          expected: Query plan shows cluster or partition pruning
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
      product_status: INHERITED

  - id: OB-003
    dimension: Objects
    name: Staging Table (integration.purchase_staging) to Bronze Delta Table with Overwrite Mode
    intent: >
      Migrate integration.purchase_staging to a bronze Delta Lake managed table in
      inventory_stock.bronze, implementing proper overwrite semantics at each ETL run start
      to correct the confirmed SSIS staging-truncation bug (which targeted
      Integration.Order_Staging instead of Integration.Purchase_Staging, causing stale
      rows to accumulate). The Databricks replacement must explicitly truncate or overwrite
      the staging table before each incremental extract load.
    activation:
      preconditions:
        - Source object is integration.purchase_staging in the SQL Server integration schema
        - Unity Catalog catalog inventory_stock and schema inventory_stock.bronze exist
      scope: project
    transformation:
      source:
        object_type: TABLE
        schema_pattern: "integration.purchase_staging"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: DELTA_MANAGED_TABLE
        schema: "inventory_stock.bronze"
        naming_convention: "inventory_stock.bronze.purchase_staging"
        platform: "Databricks (Delta Lake)"
        properties:
          - TBLPROPERTIES layer = 'bronze'
          - delta.deletedFileRetentionDuration = 'interval 1 days'
          - delta.logRetentionDuration = 'interval 7 days'
    algorithm: >
      1. Map integration.purchase_staging → inventory_stock.bronze.purchase_staging
         (snake_case columns; strip brackets; rename space-bearing source IDs accordingly).
      2. Translate all 14 source column data types per TY dimension rules; retain the
         PurchaseStagingKey IDENTITY column for row traceability within a run; translate
         to INT GENERATED ALWAYS AS IDENTITY.
      3. CRITICAL — fix the SSIS staging-truncation bug:
         - At the start of each ETL Databricks Workflow run, execute a TRUNCATE TABLE
           inventory_stock.bronze.purchase_staging (or use spark.write.mode("overwrite"))
           before writing any extracted rows.
         - The SSIS dataflow that issued DELETE FROM Integration.Order_Staging is replaced
           by an explicit TRUNCATE step as the first task in the purchase load Workflow.
         - This is a correctness fix, not an optional optimisation.
      4. Add load_timestamp TIMESTAMP DEFAULT current_timestamp() and
         batch_id STRING audit columns to correlate staging rows to a specific ETL batch run.
      5. Set short retention properties (1-day deleted file retention) as staging data
         is ephemeral and should not drive long-term storage costs.
      6. Do NOT add delta.enableChangeDataFeed on the bronze staging table; CDF is not
         required for an overwrite-mode transient table.
      7. Emit CREATE TABLE … USING DELTA statement in generated DDL.
    validation:
      success_criteria:
        - inventory_stock.bronze.purchase_staging exists in Unity Catalog
        - audit columns (load_timestamp, batch_id) present and non-null after each run
        - After each ETL run, row count equals source extract count with no stale rows
          from prior runs
        - No duplicate WWI Purchase Order ID rows from accumulation of prior batches
        - TRUNCATE or overwrite step present as first task in Databricks Workflow definition
      quality_dimensions:
        - completeness
        - conformity
        - validity
      test_cases:
        - name: staging_table_existence
          description: Assert inventory_stock.bronze.purchase_staging exists
          expected: Table present in Unity Catalog
        - name: staging_truncate_fix
          description: >
            Execute two consecutive ETL runs with different extract windows;
            assert staging row count after run 2 equals run 2 extract count only
            (not run 1 + run 2)
          expected: No row accumulation across runs; count = current run extract count
        - name: staging_audit_columns
          description: Assert load_timestamp and batch_id present and non-null after load
          expected: Both columns present with non-null values on all rows
        - name: staging_no_stale_rows
          description: >
            After a full ETL cycle, query purchase_staging for rows with
            load_timestamp < current_run start; assert 0 rows
          expected: 0 rows from prior batch windows
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
      product_status: EXTENDED   # by OB-P002 — adds lineage_key BIGINT NOT NULL and _extracted_at_utc TIMESTAMP NOT NULL to staging DDL

  - id: OB-004
    dimension: Objects
    name: Control / Infrastructure Tables (integration.etl cutoff, integration.lineage) to Bronze Control Delta Tables
    intent: >
      Migrate the two shared ETL control tables — integration.[etl cutoff] (incremental
      watermark store) and integration.lineage (ETL run audit log) — to Delta Lake managed
      tables in inventory_stock.bronze, replacing SQL Server transaction semantics with
      Delta ACID guarantees. These tables are shared across project products and must be
      available to all ETL tasks in the Databricks Workflow.
    activation:
      preconditions:
        - Source objects are integration.[etl cutoff] and integration.lineage in the SQL
          Server integration schema
        - Unity Catalog catalog inventory_stock and schema inventory_stock.bronze exist
        - Both tables are shared infrastructure consumed by multiple ETL tasks
      scope: project
    transformation:
      source:
        object_type: TABLE
        schema_pattern: "integration.[etl cutoff] | integration.lineage"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: DELTA_MANAGED_TABLE
        schema: "inventory_stock.bronze"
        naming_convention: >
          integration.[etl cutoff] → inventory_stock.bronze.etl_cutoff
          integration.lineage     → inventory_stock.bronze.etl_lineage
        platform: "Databricks (Delta Lake)"
        properties:
          - TBLPROPERTIES layer = 'bronze_control'
          - delta.enableChangeDataFeed = false
    algorithm: >
      1. Map source tables to target names (snake_case, remove brackets and spaces):
         - integration.[etl cutoff] → inventory_stock.bronze.etl_cutoff
         - integration.lineage      → inventory_stock.bronze.etl_lineage
      2. Translate column data types per TY dimension rules:
         - etl_cutoff: table_name STRING (PK), cutoff_time TIMESTAMP
         - etl_lineage: lineage_key INT (PK, GENERATED ALWAYS AS IDENTITY to replace
           SEQUENCE dependency — see OB-006), data_load_started TIMESTAMP,
           table_name STRING, data_load_completed TIMESTAMP, was_successful BOOLEAN,
           source_system_cutoff_time TIMESTAMP
      3. Delta ACID transactions replace SQL Server BEGIN TRAN / COMMIT / ROLLBACK patterns
         used in migratestagedpurchasedata for watermark advancement and lineage updates.
         Each Delta write to etl_cutoff or etl_lineage is atomic by default.
      4. Seed initial rows in etl_cutoff for fact.purchase (table_name = 'fact.purchase',
         cutoff_time = base epoch) as part of the environment initialisation notebook.
      5. Grant SELECT, INSERT, UPDATE to the ETL service principal; grant SELECT to
         monitoring and alerting service principals.
      6. Both tables are shared across project products; do NOT create product-scoped
         copies — all products read from and write to the same control tables in
         inventory_stock.bronze.
      7. Emit CREATE TABLE … USING DELTA statements in generated DDL.
    validation:
      success_criteria:
        - inventory_stock.bronze.etl_cutoff and inventory_stock.bronze.etl_lineage exist
        - etl_cutoff contains at least one seeded row for table_name = 'fact.purchase'
        - etl_lineage lineage_key uses GENERATED ALWAYS AS IDENTITY; no manual key inserts
        - Delta ACID write confirms atomicity of watermark update + lineage close in ETL run
        - Both tables accessible (SELECT) by the ETL service principal and monitoring roles
      quality_dimensions:
        - completeness
        - accuracy
        - consistency
        - validity
      test_cases:
        - name: control_tables_existence
          description: Assert etl_cutoff and etl_lineage exist in inventory_stock.bronze
          expected: Both tables present in Unity Catalog
        - name: etl_cutoff_seed_row
          description: >
            Assert etl_cutoff contains a row for table_name = 'fact.purchase' after
            environment initialisation
          expected: 1 row present with non-null cutoff_time
        - name: lineage_key_identity
          description: >
            Insert two rows into etl_lineage in sequence; assert lineage_key values
            are unique and monotonically increasing
          expected: Second lineage_key > first lineage_key; no duplicates
        - name: acid_watermark_update
          description: >
            Simulate an ETL run; assert etl_cutoff.cutoff_time updated and
            etl_lineage row closed atomically (no partial state)
          expected: Both writes complete or both fail; no partial-update state observed
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
      product_status: INHERITED

  - id: OB-005
    dimension: Objects
    name: ETL Stored Procedures to Python Notebooks and Delta SQL Tasks in Databricks Workflow
    intent: >
      Migrate the three core integration-schema ETL stored procedures
      (integration.migratestagedpurchasedata, integration.getlastetlcutofftime,
      integration.getlineagekey) to Python notebooks or Delta SQL task modules within a
      Databricks Workflow, rewriting T-SQL MERGE / INSERT-SELECT / UPDATE logic as
      PySpark Delta MERGE INTO operations and Python utility functions, and preserving
      the SCD-2 surrogate key resolution logic with full temporal accuracy.
    activation:
      preconditions:
        - Source objects are stored procedures in the SQL Server integration schema:
          migratestagedpurchasedata, getlastetlcutofftime, getlineagekey
        - Databricks Workflows environment is available in the target
        - Target Delta tables (etl_cutoff, etl_lineage, silver_dim.supplier,
          silver_dim.stock_item, silver_fact.purchase) are already provisioned
      scope: project
    transformation:
      source:
        object_type: STORED_PROCEDURE
        schema_pattern: "integration.migratestagedpurchasedata | integration.getlastetlcutofftime | integration.getlineagekey"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: DATABRICKS_NOTEBOOK or DATABRICKS_WORKFLOW_TASK
        schema: "N/A (orchestration layer)"
        naming_convention: >
          migratestagedpurchasedata → src/etl/migrate_staged_purchase_data.py
          getlastetlcutofftime      → src/etl/etl_control.py (utility function get_last_etl_cutoff_time)
          getlineagekey             → src/etl/etl_control.py (utility function get_next_lineage_key)
        platform: "Databricks (Delta Lake)"
    algorithm: >
      1. getlastetlcutofftime:
         - Translate to Python function get_last_etl_cutoff_time(table_name: str) -> datetime
           that executes: spark.sql("SELECT cutoff_time FROM inventory_stock.bronze.etl_cutoff
           WHERE table_name = '<table_name>'").collect()[0][0]
         - Returns a datetime value to be used as @LastCutoff in the extract query.
      2. getlineagekey:
         - Translate to Python function get_next_lineage_key(table_name: str) -> int that
           INSERTs a new run-start row into inventory_stock.bronze.etl_lineage and returns
           the generated lineage_key identity value (see OB-006 for SEQUENCE retirement).
         - Use a RETURNING clause or a MAX(lineage_key) read-after-insert pattern to
           retrieve the generated key atomically.
      3. migratestagedpurchasedata:
         a. Read ETL watermark via get_last_etl_cutoff_time('fact.purchase') → last_cutoff.
         b. Compute new_cutoff = current_timestamp().
         c. Get lineage key via get_next_lineage_key('fact.purchase') → lineage_key.
         d. SCD-2 Supplier Key resolution → translate T-SQL correlated UPDATE to a PySpark
            broadcast join or Databricks SQL UPDATE … FROM pattern:
            UPDATE bronze.purchase_staging stg
            SET supplier_key = COALESCE(
                (SELECT s.supplier_key FROM silver_dim.supplier s
                 WHERE s.wwi_supplier_id = stg.wwi_supplier_id
                   AND stg.last_modified_when > s.valid_from
                   AND stg.last_modified_when <= s.valid_to
                 ORDER BY s.valid_from LIMIT 1), 0)
         e. SCD-2 Stock Item Key resolution → identical pattern against silver_dim.stock_item.
         f. Fact load — implement the order-level delete+insert pattern using Delta MERGE
            INTO or a staged DELETE + INSERT approach:
            - DELETE FROM silver_fact.purchase WHERE wwi_purchase_order_id IN
              (SELECT wwi_purchase_order_id FROM bronze.purchase_staging)
            - INSERT INTO silver_fact.purchase SELECT ..., lineage_key FROM bronze.purchase_staging
         g. Close lineage row: UPDATE etl_lineage SET data_load_completed = current_timestamp(),
            was_successful = TRUE WHERE lineage_key = <lineage_key>.
         h. Advance watermark: UPDATE etl_cutoff SET cutoff_time = new_cutoff
            WHERE table_name = 'fact.purchase'.
      4. Wrap all steps in Python try/except; on failure call lineage closure with
         was_successful = FALSE and re-raise the exception to fail the Workflow task.
      5. T-SQL MERGE INTO → Delta MERGE INTO (with WHEN MATCHED / WHEN NOT MATCHED clauses)
         where a true upsert pattern is preferred over delete+insert.
      6. Emit Python source files in src/etl/; emit Databricks Workflow JSON task definitions
         referencing each notebook/module.
    validation:
      success_criteria:
        - All 3 source stored procedures have corresponding Python functions or notebook tasks
        - Databricks Workflow executes the Purchase load end-to-end without errors
        - SCD-2 key resolution produces the same supplier_key / stock_item_key values as
          the source T-SQL procedure for a representative test data set
        - Lineage rows opened and closed correctly in etl_lineage for each run
        - ETL watermark advanced correctly in etl_cutoff after each successful run
        - No T-SQL procedural constructs (DECLARE, SET, TRY/CATCH, EXEC) in Python artifacts
      quality_dimensions:
        - completeness
        - accuracy
        - consistency
        - timeliness
      test_cases:
        - name: etl_task_coverage
          description: >
            Assert src/etl/migrate_staged_purchase_data.py and src/etl/etl_control.py
            exist and contain the expected function signatures
          expected: Both files present with all required functions
        - name: etl_scd2_key_resolution_parity
          description: >
            Run both SQL Server procedure and Databricks notebook against identical
            staging data; compare supplier_key and stock_item_key output column values
          expected: Zero discrepancy in resolved keys across all test rows
        - name: etl_full_load_run
          description: >
            Execute the Databricks Workflow for a full purchase load run; assert all
            tasks succeed and fact row counts match expected extract count
          expected: All tasks SUCCESS; fact.purchase row delta = staging row count
        - name: etl_lineage_closure
          description: >
            Assert etl_lineage row for the run has was_successful = TRUE and
            non-null data_load_completed after a successful run
          expected: 1 closed lineage row per run with was_successful = TRUE
        - name: etl_idempotency
          description: >
            Execute the workflow twice with the same watermark window; assert fact row
            count identical after second run (order-level re-load is idempotent)
          expected: Row count unchanged after second run; no duplicates
    inheritance:
      level: project
      override: false
      extend: true
      deactivate: false
      product_status: EXTENDED   # by OB-P004 — scd2_merge.py, sk_resolver.py, fact_merge.py promoted as explicit named migration targets in src/common/

  - id: OB-006
    dimension: Objects
    name: SEQUENCE Object (sequences.lineagekey) to GENERATED ALWAYS AS IDENTITY on etl_lineage
    intent: >
      Retire the SQL Server SEQUENCE object sequences.lineagekey and replace its
      monotonically increasing key generation with a BIGINT GENERATED ALWAYS AS IDENTITY
      column on the inventory_stock.bronze.etl_lineage Delta table, eliminating the
      need for a separate SEQUENCE object and the NEXT VALUE FOR T-SQL construct that
      has no native Databricks equivalent.
    activation:
      preconditions:
        - Source object is the SQL Server SEQUENCE sequences.lineagekey
        - The SEQUENCE is consumed solely via integration.getlineagekey stored procedure
        - Target table inventory_stock.bronze.etl_lineage is being created as part of
          this migration (see OB-004)
      scope: project
    transformation:
      source:
        object_type: SEQUENCE
        schema_pattern: "sequences.lineagekey"
        platform: "Microsoft SQL Server 2014"
      target:
        object_type: IDENTITY_COLUMN on DELTA_MANAGED_TABLE
        schema: "inventory_stock.bronze (column attribute on etl_lineage)"
        naming_convention: "lineage_key BIGINT GENERATED ALWAYS AS IDENTITY"
        platform: "Databricks (Delta Lake)"
    algorithm: >
      1. Replace NEXT VALUE FOR Sequences.LineageKey with the IDENTITY column value
         generated by an INSERT INTO etl_lineage ... returning lineage_key (or equivalent
         MAX(lineage_key) + read-after-insert pattern if RETURNING is not available in
         the runtime version).
      2. Define etl_lineage.lineage_key as BIGINT GENERATED ALWAYS AS IDENTITY
         (START WITH 1 INCREMENT BY 1) in the CREATE TABLE DDL (see OB-004).
      3. The Python utility function get_next_lineage_key() in src/etl/etl_control.py
         performs:
         - spark.sql("INSERT INTO inventory_stock.bronze.etl_lineage
             (data_load_started, table_name) VALUES (current_timestamp(), '<table>')")
         - return spark.sql("SELECT MAX(lineage_key) FROM
             inventory_stock.bronze.etl_lineage WHERE table_name = '<table>'
             AND data_load_completed IS NULL").collect()[0][0]
      4. Drop the sequences schema entirely in the target; no schema-level SEQUENCE
         construct is needed in Unity Catalog.
      5. Document in the migration registry that sequences.lineagekey is RETIRED with
         disposition = 'REPLACED_BY_IDENTITY_COLUMN' and target reference
         'inventory_stock.bronze.etl_lineage.lineage_key'.
      6. Verify Delta ACID guarantees prevent duplicate lineage_key values under
         concurrent ETL task execution.
    validation:
      success_criteria:
        - No SEQUENCE or NEXT VALUE FOR T-SQL syntax in any generated artifact
        - etl_lineage.lineage_key defined as BIGINT GENERATED ALWAYS AS IDENTITY
        - get_next_lineage_key() function returns unique monotonically increasing values
          across consecutive ETL runs
        - No duplicate lineage_key values in etl_lineage after multiple ETL runs
        - Migration registry records sequences.lineagekey as RETIRED
      quality_dimensions:
        - uniqueness
        - accuracy
        - consistency
        - validity
      test_cases:
        - name: no_sequence_syntax_in_artifacts
          description: >
            Grep all generated artifacts for NEXT VALUE FOR, CREATE SEQUENCE,
            or sequences. references; assert none found
          expected: 0 matches
        - name: lineage_key_identity_defined
          description: >
            Assert etl_lineage DDL contains GENERATED ALWAYS AS IDENTITY on lineage_key
          expected: IDENTITY attribute present in DDL
        - name: lineage_key_uniqueness
          description: >
            After 5 ETL runs, assert no duplicate lineage_key values in etl_lineage
          expected: COUNT(*) = COUNT(DISTINCT lineage_key) = 5
        - name: sequence_retired_in_registry
          description: >
            Assert migration registry contains a row for sequences.lineagekey with
            disposition = 'REPLACED_BY_IDENTITY_COLUMN'
          expected: 1 registry row present with correct disposition
    inheritance:
