ruleInheritance:
  projectRulesVersion: "1.0"
  overrides:
    - ruleId: "TY-P001"
      action: override
      overrides: "TY-012"
      reason: "SCD-2 validity columns (valid_from, valid_to) on Purchase SCD-2 dimension tables must be DATE, not TIMESTAMP_NTZ, to align with business date semantics and SCD-2 temporal JOIN probe columns"
    - ruleId: "TY-P002"
      action: extend
      extends: "TY-012"
      reason: "Define the full 5-column SCD-2 control block pattern for Purchase dimension tables"
    - ruleId: "TY-P003"
      action: extend
      extends: "TY-005"
      reason: "Add explicit MONEY and SMALLMONEY type mappings not covered by project TY rules"
    - ruleId: "TY-P004"
      action: extend
      extends: "TY-009"
      reason: "Map SQL Server geography CLR type to three target columns (_wkt, _lat, _lon)"
    - ruleId: "OB-P001"
      action: extend
      extends: "OB-001"
      reason: "Require key=0 sentinel row bootstrap notebook for every SCD-2 dimension table"
    - ruleId: "OB-P002"
      action: extend
      extends: "OB-003"
      reason: "Add lineage_key and _extracted_at_utc audit columns to purchase_staging"
    - ruleId: "OB-P003"
      action: extend
      extends: "OB-008"
      reason: "Classify analytics views as MATERIALIZED vs regular VIEW based on aggregation presence"
    - ruleId: "OB-P004"
      action: extend
      extends: "OB-005"
      reason: "Promote scd2_merge.py, sk_resolver.py, fact_merge.py as explicit named shared helper modules"
    - ruleId: "PE-P001"
      action: extend
      extends: "PE-002"
      reason: "Add PARTITIONED BY + ZORDER alternative strategy for pre-DBR 13.3 runtimes"
    - ruleId: "PE-P002"
      action: extend
      extends: "PE-003"
      reason: "Make OPTIMIZE conditional on rows_merged > FACT_OPTIMIZE_ROW_THRESHOLD (10,000)"
    - ruleId: "LN-P001"
      action: extend
      extends: "LN-003"
      reason: "Specify dbutils.jobs.taskValues as the exact lineage_key injection mechanism for the Purchase Workflow architecture"
    - ruleId: "SX-P001"
      action: extend
      extends: "SX-004"
      reason: "Add exact dbutils.jobs.taskValues pattern as canonical replacement for EXEC Integration.GetLineageKey"
    - ruleId: "SX-P002"
      action: extend
      extends: "SX-017"
      reason: "Add CONVERT(CHAR(8), GETDATE()-N, 112) → DATE_FORMAT(DATE_SUB(current_date(), N), 'yyyyMMdd') mapping"
    - ruleId: "SX-P003"
      action: extend
      extends: "SX-003"
      reason: "Add sk_resolver.py pre-join step pattern as canonical replacement for inline UPDATE staging SET key = (SELECT TOP(1)...) pattern"
    - ruleId: "SX-P004"
      action: new
      dimension: "SX"
      reason: "Convert inline lineage-close UPDATE Integration.Lineage pattern to spark.sql UPDATE with Python variable injection"
    - ruleId: "QA-P001"
      action: new
      dimension: "QA"
      reason: "Row count reconciliation between staging and fact table — blocking failure on mismatch"
    - ruleId: "QA-P002"
      action: new
      dimension: "QA"
      reason: "Orphaned surrogate key detection — informational, non-blocking"
    - ruleId: "QA-P003"
      action: new
      dimension: "QA"
      reason: "RI checks via LEFT ANTI JOIN; violations written to dq_rejections"
    - ruleId: "QA-P004"
      action: new
      dimension: "QA"
      reason: "Business rule assertions on loaded Purchase data — informational, non-blocking"
    - ruleId: "QA-P005"
      action: new
      dimension: "QA"
      reason: "Centralised DQ rejection store with lineage_key for traceability"
    - ruleId: "CX-P001"
      action: new
